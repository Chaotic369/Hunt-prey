<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hunter & Prey 💘</title>

<style>
/* ================= THEME VARIABLES ================= */
:root{
  --bg:#020617;
  --panel:#0f172a;
  --left:#1f2933;
  --right:#2563eb;
  --text:#e5e7eb;
}

/* ===== THEMES (10) ===== */
.theme-0{--bg:#020617;--panel:#0f172a;--left:#1f2933;--right:#2563eb}
.theme-1{--bg:#120308;--panel:#2a0f14;--left:#3a1418;--right:#dc2626}
.theme-2{--bg:#02140c;--panel:#0f2a1e;--left:#143a2c;--right:#16a34a}
.theme-3{--bg:#12021a;--panel:#24103a;--left:#2e1446;--right:#7c3aed}
.theme-4{--bg:#000000;--panel:#050505;--left:#111111;--right:#ffffff}
.theme-5{--bg:#0b1020;--panel:#1e293b;--left:#334155;--right:#38bdf8}
.theme-6{--bg:#140c02;--panel:#2a1a0f;--left:#3a2414;--right:#f59e0b}
.theme-7{--bg:#021013;--panel:#0f2a30;--left:#143a40;--right:#06b6d4}
.theme-8{--bg:#101014;--panel:#1f1f2b;--left:#2a2a3a;--right:#a855f7}
.theme-9{--bg:#fafafa;--panel:#e5e7eb;--left:#ffffff;--right:#2563eb;--text:#020617}

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  color:var(--text);
  height:100dvh;
  overflow:hidden;
}
.app{
  max-width:520px;
  margin:0 auto;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:10px 16px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--bg);
}
.ig-user-info{
  display:flex;
  align-items:center;
  gap:10px;
}
.ig-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--panel);
  border:2px solid var(--right);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}
.ig-meta{
  display:flex;
  flex-direction:column;
}
.ig-meta h1{
  font-size:15px;
  font-weight:700;
  letter-spacing:-0.2px;
}
.ig-substatus{
  display:flex;
  align-items:center;
  gap:4px;
}
.status{
  font-size:11px;
  opacity:.6;
}
.status.online{color:#10b981;opacity:1}
.status.typing-text{color:var(--right);font-weight:600;font-style:italic}
.actions{
  display:flex;
  gap:16px;
  align-items:center;
}
.action{
  font-size:18px;
  cursor:pointer;
  transition:transform 0.15s ease;
}
.action:active{transform:scale(0.9)}

/* CHAT */
.messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.bubble{
  max-width:76%;
  padding:10px 15px;
  border-radius:18px;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  cursor:pointer;
  word-break:break-word;
  transition:transform 0.2s cubic-bezier(0.18,0.89,0.32,1.28);
}
.bubble:active{transform:scale(0.98)}
.right{
  background:var(--right);
  color:#fff;
  margin-left:auto;
  border-bottom-right-radius:4px;
}
.left{
  background:var(--left);
  color:var(--text);
  margin-right:auto;
  border-bottom-left-radius:4px;
}
.bubble-reply-ref{
  background:rgba(0,0,0,0.22);
  border-left:3px solid #fff;
  border-radius:4px;
  padding:4px 8px;
  margin-bottom:6px;
  font-size:11px;
  opacity:0.9;
}
.bubble-reply-ref .reply-user{
  font-weight:700;
  font-size:10px;
}
.time{
  font-size:9px;
  opacity:.45;
  margin-top:4px;
  text-align:right;
}
.reactions{
  position:absolute;
  bottom:-8px;
  right:8px;
  background:var(--panel);
  border:2px solid var(--bg);
  border-radius:12px;
  padding:1px 5px;
  font-size:11px;
  display:flex;
  align-items:center;
  gap:2px;
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
  z-index:5;
}

/* INSTAGRAM STYLE CONTEXT OVERLAY & BOTTOM SHEET */
.context-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:3000;
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.context-menu{
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:16px;
  animation:slideUp 0.25s cubic-bezier(0.16,1,0.3,1);
  padding-bottom:max(20px, env(safe-area-inset-bottom));
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ig-reaction-capsule{
  background:#262626;
  border-radius:32px;
  padding:8px 18px;
  display:flex;
  gap:14px;
  font-size:26px;
  box-shadow:0 6px 20px rgba(0,0,0,0.5);
}
.ig-reaction-capsule span{
  cursor:pointer;
  transition:transform 0.15s cubic-bezier(0.18,0.89,0.32,1.28);
  line-height:1;
}
.ig-reaction-capsule span:active{transform:scale(1.4)}
.ig-action-sheet{
  width:100%;
  background:#262626;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.ig-action-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:transparent;
  border:none;
  border-bottom:1px solid rgba(255,255,255,0.08);
  color:#fff;
  font-size:15px;
  font-weight:500;
  cursor:pointer;
}
.ig-action-item:last-child{border-bottom:none}
.ig-action-item:active{background:rgba(255,255,255,0.06)}
.ig-action-item.danger{color:#ed4956;font-weight:600}

/* INPUT ACTION BANNER (REPLY/EDIT) */
.input-action-banner{
  padding:8px 16px;
  background:rgba(255,255,255,0.06);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
}
.banner-text{
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow:hidden;
  max-width:85%;
}
.banner-title{
  font-weight:700;
  color:var(--right);
  font-size:11px;
}
.banner-desc{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  opacity:.75;
}
.banner-close{
  cursor:pointer;
  font-size:16px;
  opacity:.6;
  padding:2px 6px;
}
.banner-close:hover{opacity:1}

/* VOICE */
.voice{display:flex;align-items:center;gap:10px}
.play{
  width:30px;height:30px;border-radius:50%;
  background:#fff;color:#000;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer
}
.progress{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.bar{height:100%;width:0%;background:#fff}
.duration{font-size:11px;opacity:.7;min-width:34px;text-align:right}

/* MEDIA */
.media{max-width:200px;border-radius:16px;overflow:hidden;cursor:pointer}
.media img,.media video{width:100%;display:block}

/* INPUT */
.input{
  padding:10px;
  border-top:1px solid var(--panel);
  display:flex;
  gap:8px;
  align-items:center;
}
textarea{
  flex:1;
  background:var(--panel);
  border:none;
  outline:none;
  color:var(--text);
  padding:12px 16px;
  border-radius:22px;
  resize:none;
  font-family:inherit;
}
.icon{
  width:42px;height:42px;border-radius:50%;
  background:var(--panel);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:20px;
}
.send{background:var(--right);color:#fff}

/* VIEWER */
.viewer{
  position:fixed;inset:0;background:#000;
  display:none;align-items:center;justify-content:center;
  z-index:1000;
}
.viewer img,.viewer video{max-width:100%;max-height:100%}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;
  z-index:2000;
}
.modal-content{
  background:var(--panel);
  padding:24px;
  border-radius:16px;
  max-width:400px;
  width:90%;
}
.modal-content h2{margin-bottom:16px;font-size:18px}
.modal-content input{
  width:100%;
  padding:12px 16px;
  background:var(--bg);
  border:1px solid var(--left);
  border-radius:8px;
  color:var(--text);
  margin-bottom:12px;
  font-size:14px;
}
.modal-content button{
  width:100%;
  padding:12px;
  background:var(--right);
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}
.modal-content button:hover{opacity:.9}
.role-select{
  display:flex;
  gap:12px;
  margin-bottom:16px;
}
.role-btn{
  flex:1;
  padding:16px;
  background:var(--left);
  border:2px solid transparent;
  border-radius:12px;
  cursor:pointer;
  text-align:center;
  font-size:14px;
}
.role-btn.active{
  border-color:var(--right);
  background:var(--right);
}
</style>
</head>

<body class="theme-0">
<div class="app">

<div class="header">
  <div class="ig-user-info">
    <div class="ig-avatar" id="partnerAvatar">💘</div>
    <div class="ig-meta">
      <h1 id="chatTitle">Direct</h1>
      <div class="ig-substatus">
        <span class="status" id="status">● offline</span>
        <span class="status typing-text" id="typingIndicator" style="display:none;">typing...</span>
      </div>
    </div>
  </div>
  <div class="actions">
    <div class="action" id="theme" title="Change Theme">🎨</div>
    <div class="action" id="clear" title="Clear Chat">🗑️</div>
  </div>
</div>

<div class="messages" id="messages"></div>

<div class="input-action-banner" id="inputActionBanner" style="display:none;">
  <div class="banner-text">
    <span class="banner-title" id="bannerTitle">Replying</span>
    <span class="banner-desc" id="bannerDesc">...</span>
  </div>
  <span class="banner-close" id="bannerClose">✕</span>
</div>

<div class="input">
  <label class="icon" title="Photos & Videos">🖼️
    <input type="file" hidden id="media" accept="image/*,video/*">
  </label>
  <textarea id="text" placeholder="Message…" rows="1"></textarea>
  <div class="icon" id="mic" title="Voice note">🎤</div>
  <div class="icon send" id="send" title="Send">➤</div>
</div>

<div class="viewer" id="viewer">
  <span id="closeViewer" style="position:absolute;top:20px;right:20px;font-size:24px;cursor:pointer;color:#fff;">×</span>
  <div id="viewerContent"></div>
</div>

</div>

<!-- SETUP MODAL -->
<div class="modal" id="setupModal">
  <div class="modal-content">
    <h2>🔥 Setup</h2>
    <div class="role-select">
      <div class="role-btn" data-role="hunter">🎯 Hunter</div>
      <div class="role-btn" data-role="prey">💖 Prey</div>
    </div>
    <input type="text" id="roomCode" placeholder="Enter room code...">
    <button id="joinBtn">Join Chat</button>
  </div>
</div>

<!-- INSTAGRAM CONTEXT MENU -->
<div class="context-overlay" id="contextOverlay">
  <div class="context-menu">
    <div class="ig-reaction-capsule" id="contextEmojis">
      <span data-emoji="❤️">❤️</span>
      <span data-emoji="😂">😂</span>
      <span data-emoji="😮">😮</span>
      <span data-emoji="😢">😢</span>
      <span data-emoji="🔥">🔥</span>
      <span data-emoji="👏">👏</span>
    </div>
    <div class="ig-action-sheet">
      <button class="ig-action-item" id="contextReply">
        <span>Reply</span>
        <span>↩️</span>
      </button>
      <button class="ig-action-item" id="contextCopy">
        <span>Copy</span>
        <span>📋</span>
      </button>
      <button class="ig-action-item" id="contextEdit" style="display:none;">
        <span>Edit</span>
        <span>✏️</span>
      </button>
      <button class="ig-action-item danger" id="contextUnsend" style="display:none;">
        <span>Unsend</span>
        <span>🗑️</span>
      </button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getDatabase, ref, push, onValue, set, remove, onDisconnect, update } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAau9fKT3kxa17lJb4g0QIqlhipJvWXPMw",
  authDomain: "hunter-prey.firebaseapp.com",
  databaseURL: "https://hunter-prey-default-rtdb.firebaseio.com",
  projectId: "hunter-prey",
  storageBucket: "hunter-prey.firebasestorage.app",
  messagingSenderId: "533931279568",
  appId: "1:533931279568:web:26dc7f86194ecfaa73cad5",
  measurementId: "G-FMC7T9SC39"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

/* STATE */
let role = localStorage.getItem("hp_role") || null;
let roomCode = localStorage.getItem("hp_room") || null;
let themeIndex = Number(localStorage.getItem("theme")) || 0;

/* ELEMENTS */
const messages = document.getElementById("messages");
const text = document.getElementById("text");
const send = document.getElementById("send");
const media = document.getElementById("media");
const mic = document.getElementById("mic");
const viewer = document.getElementById("viewer");
const viewerContent = document.getElementById("viewerContent");
const closeViewer = document.getElementById("closeViewer");
const setupModal = document.getElementById("setupModal");
const roomCodeInput = document.getElementById("roomCode");
const joinBtn = document.getElementById("joinBtn");
const status = document.getElementById("status");
const typingIndicator = document.getElementById("typingIndicator");
const contextOverlay = document.getElementById("contextOverlay");
const partnerAvatar = document.getElementById("partnerAvatar");
const chatTitle = document.getElementById("chatTitle");
const inputActionBanner = document.getElementById("inputActionBanner");
const bannerTitle = document.getElementById("bannerTitle");
const bannerDesc = document.getElementById("bannerDesc");
const bannerClose = document.getElementById("bannerClose");
let activeMessageId = null;
let isLongPress = false;
let replyingTo = null;
let editingMessageId = null;
let allMsgs = [];

/* SETUP */
if (!role || !roomCode) {
  setupModal.style.display = "flex";
}

document.querySelectorAll(".role-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    role = btn.dataset.role;
  };
});

joinBtn.onclick = () => {
  const code = roomCodeInput.value.trim();
  if (!role || !code) {
    alert("Please select a role and enter a room code");
    return;
  }
  roomCode = code;
  localStorage.setItem("hp_role", role);
  localStorage.setItem("hp_room", roomCode);
  setupModal.style.display = "none";
  initChat();
};

/* THEME */
applyTheme();
function applyTheme() {
  document.body.className = "theme-" + themeIndex;
  localStorage.setItem("theme", themeIndex);
}
document.getElementById("theme").onclick = () => {
  themeIndex = (themeIndex + 1) % 10;
  applyTheme();
};

/* PRESENCE */
function setupPresence() {
  const presenceRef = ref(db, `rooms/${roomCode}/presence/${role}`);
  set(presenceRef, { online: true, timestamp: Date.now() });
  onDisconnect(presenceRef).remove();
  
  const otherRole = role === "hunter" ? "prey" : "hunter";
  partnerAvatar.textContent = otherRole === "hunter" ? "🎯" : "💖";
  chatTitle.textContent = otherRole === "hunter" ? "Hunter" : "Prey";

  // Monitor other user's presence
  onValue(ref(db, `rooms/${roomCode}/presence/${otherRole}`), snapshot => {
    if (snapshot.exists()) {
      status.textContent = "● Active now";
      status.classList.add("online");
    } else {
      status.textContent = "● Offline";
      status.classList.remove("online");
    }
  });

  // Monitor other user's typing status
  onValue(ref(db, `rooms/${roomCode}/typing/${otherRole}`), snapshot => {
    typingIndicator.style.display = snapshot.val() ? "inline" : "none";
  });
}

/* CHAT INIT */
function initChat() {
  setupPresence();
  
  const messagesRef = ref(db, `rooms/${roomCode}/messages`);
  onValue(messagesRef, snapshot => {
    const msgs = [];
    snapshot.forEach(child => {
      msgs.push({ id: child.key, ...child.val() });
    });
    render(msgs);
  });
}

/* RENDER */
function render(msgs) {
  let html = "";
  allMsgs = msgs;
  msgs.sort((a, b) => a.time - b.time);
  
  msgs.forEach((m, i) => {
    const side = m.sender === role ? "right" : "left";
    let content = "";
    
    if (m.type === "text") {
      content = escapeHtml(m.text);
    }
    
    if (m.type === "voice") {
      content = `<div class="voice">
        <div class="play" data-i="${i}">▶</div>
        <div class="progress"><div class="bar" id="bar-${i}"></div></div>
        <div class="duration">${format(m.duration)}</div>
        <audio id="audio-${i}" src="${m.src}"></audio>
      </div>`;
    }
    
    if (m.type === "media") {
      content = `<div class="media" data-i="${i}">
        ${m.mediaType === "image" ? `<img src="${m.src}">` : `<video src="${m.src}" muted></video>`}
      </div>`;
    }

    let replySnippet = "";
    if (m.replyTo) {
      replySnippet = `<div class="bubble-reply-ref">
        <div class="reply-user">${escapeHtml(m.replyTo.sender === role ? 'You' : m.replyTo.sender)}</div>
        <div>${escapeHtml(m.replyTo.text)}</div>
      </div>`;
    }
    
    let reactionsHtml = "";
    if (m.reactions) {
      const emojis = Object.values(m.reactions);
      if (emojis.length > 0) {
        reactionsHtml = `<div class="reactions">${emojis.join("")}</div>`;
      }
    }
    
    html += `
      <div class="bubble ${side}" data-id="${m.id}" data-sender="${m.sender}">
        ${replySnippet}
        ${content}
        <div class="time">${new Date(m.time).toLocaleTimeString([], {
          hour: "2-digit", minute: "2-digit"
        })}${m.edited ? ' • edited' : ''}</div>
        ${reactionsHtml}
      </div>`;
  });
  
  messages.innerHTML = html;
  attachVoice();
  attachMedia(msgs);
  attachLongPress();
  messages.scrollTop = messages.scrollHeight;
}

/* INSTAGRAM-STYLE ACTIONS */
function setReplyTarget(msg) {
  replyingTo = {
    id: msg.id,
    sender: msg.sender,
    text: msg.type === "text" ? msg.text : (msg.type === "voice" ? "🎤 Voice message" : "📷 Media")
  };
  editingMessageId = null;
  bannerTitle.textContent = `Replying to ${msg.sender === role ? 'yourself' : msg.sender}`;
  bannerDesc.textContent = replyingTo.text;
  inputActionBanner.style.display = "flex";
  contextOverlay.style.display = "none";
  text.focus();
  if (navigator.vibrate) navigator.vibrate(50);
}

function setEditTarget(msg) {
  if (msg.sender !== role || msg.type !== "text") return;
  editingMessageId = msg.id;
  replyingTo = null;
  bannerTitle.textContent = "Editing message";
  bannerDesc.textContent = msg.text;
  inputActionBanner.style.display = "flex";
  text.value = msg.text;
  contextOverlay.style.display = "none";
  text.focus();
}

bannerClose.onclick = () => {
  if (editingMessageId) text.value = "";
  editingMessageId = null;
  replyingTo = null;
  inputActionBanner.style.display = "none";
};

function attachLongPress() {
  let pressTimer;
  let lastTap = 0;
  
  document.querySelectorAll('.bubble').forEach(b => {
    let startX = 0, currentX = 0;
    
    const startPress = (e) => {
      if (e.target.closest('.play') || e.target.closest('.progress')) return;
      isLongPress = false;
      startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      currentX = startX;
      
      pressTimer = setTimeout(() => {
        isLongPress = true;
        openContextMenu(b.dataset.id, b.dataset.sender);
      }, 450);
    };
    
    const movePress = (e) => {
      if (!startX) return;
      currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      const deltaX = currentX - startX;
      if (Math.abs(deltaX) > 10) clearTimeout(pressTimer);
      if (deltaX > 0 && deltaX < 80) {
        b.style.transform = `translateX(${deltaX}px)`;
      }
    };

    const endPress = (e) => {
      clearTimeout(pressTimer);
      const deltaX = currentX - startX;
      b.style.transform = '';
      
      if (deltaX > 45) {
        const msg = allMsgs.find(m => m.id === b.dataset.id);
        if (msg) setReplyTarget(msg);
      }
      startX = 0;
      
      // Double tap to heart
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0 && !isLongPress) {
        update(ref(db, `rooms/${roomCode}/messages/${b.dataset.id}/reactions`), { [role]: "❤️" }).catch(console.error);
        if (navigator.vibrate) navigator.vibrate(50);
        e.preventDefault();
      }
      lastTap = currentTime;
    };
    
    b.addEventListener('mousedown', startPress);
    b.addEventListener('mousemove', movePress);
    b.addEventListener('mouseup', endPress);
    b.addEventListener('mouseleave', () => { clearTimeout(pressTimer); b.style.transform = ''; });
    
    b.addEventListener('touchstart', startPress, {passive: true});
    b.addEventListener('touchmove', movePress, {passive: true});
    b.addEventListener('touchend', endPress);
    
    b.addEventListener('contextmenu', e => {
      e.preventDefault();
      isLongPress = true;
      openContextMenu(b.dataset.id, b.dataset.sender);
    });
  });
}

function openContextMenu(msgId, sender) {
  activeMessageId = msgId;
  const msg = allMsgs.find(m => m.id === msgId);
  const isMine = sender === role;
  
  document.getElementById("contextUnsend").style.display = isMine ? "flex" : "none";
  document.getElementById("contextEdit").style.display = (isMine && msg && msg.type === "text") ? "flex" : "none";
  
  contextOverlay.style.display = "flex";
  if (navigator.vibrate) navigator.vibrate(50);
}

contextOverlay.onclick = (e) => {
  if (e.target === contextOverlay) contextOverlay.style.display = "none";
};

document.getElementById("contextEmojis").onclick = async (e) => {
  if (e.target.tagName === 'SPAN') {
    const emoji = e.target.dataset.emoji;
    await update(ref(db, `rooms/${roomCode}/messages/${activeMessageId}/reactions`), { [role]: emoji }).catch(console.error);
    contextOverlay.style.display = "none";
  }
};

document.getElementById("contextReply").onclick = () => {
  const msg = allMsgs.find(m => m.id === activeMessageId);
  if (msg) setReplyTarget(msg);
};

document.getElementById("contextCopy").onclick = () => {
  const msg = allMsgs.find(m => m.id === activeMessageId);
  if (msg) {
    const copyVal = msg.type === "text" ? msg.text : msg.src;
    navigator.clipboard.writeText(copyVal).catch(console.error);
  }
  contextOverlay.style.display = "none";
};

document.getElementById("contextEdit").onclick = () => {
  const msg = allMsgs.find(m => m.id === activeMessageId);
  if (msg) setEditTarget(msg);
};

document.getElementById("contextUnsend").onclick = async () => {
  if (confirm("Unsend this message?")) {
    await remove(ref(db, `rooms/${roomCode}/messages/${activeMessageId}`)).catch(console.error);
    contextOverlay.style.display = "none";
  }
};

      /* VOICE */
function attachVoice() {
  document.querySelectorAll(".play").forEach(btn => {
    const i = btn.dataset.i;
    const audio = document.getElementById("audio-" + i);
    const bar = document.getElementById("bar-" + i);
    if (!audio) return;
    
    btn.onclick = () => {
      if (audio.paused) {
        audio.play();
        btn.textContent = "⏸";
      } else {
        audio.pause();
        btn.textContent = "▶";
      }
    };
    audio.ontimeupdate = () => bar.style.width = (audio.currentTime / audio.duration * 100) + "%";
    audio.onended = () => {
      btn.textContent = "▶";
      bar.style.width = "0%";
    };
  });
}

/* MEDIA */
function attachMedia(msgs) {
  document.querySelectorAll(".media").forEach(el => {
    el.onclick = () => {
      if (isLongPress) return;
      const m = msgs[el.dataset.i];
      viewerContent.innerHTML = m.mediaType === "image"
        ? `<img src="${m.src}">`
        : `<video src="${m.src}" controls autoplay></video>`;
      viewer.style.display = "flex";
    };
  });
}

closeViewer.onclick = () => viewer.style.display = "none";
viewer.onclick = e => {
  if (e.target === viewer) viewer.style.display = "none";
};

/* UTILS */
function format(s) {
  return "0:" + String(s).padStart(2, "0");
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* SEND TEXT */
send.onclick = async () => {
  const trimmed = text.value.trim();
  if (!trimmed) return;
  
  if (editingMessageId) {
    await update(ref(db, `rooms/${roomCode}/messages/${editingMessageId}`), {
      text: trimmed,
      edited: true
    }).catch(console.error);
    editingMessageId = null;
    inputActionBanner.style.display = "none";
  } else {
    const messagesRef = ref(db, `rooms/${roomCode}/messages`);
    const payload = {
      type: "text",
      text: trimmed,
      sender: role,
      time: Date.now()
    };
    if (replyingTo) {
      payload.replyTo = replyingTo;
      replyingTo = null;
      inputActionBanner.style.display = "none";
    }
    await push(messagesRef, payload).catch(console.error);
  }
  
  text.value = "";
  set(ref(db, `rooms/${roomCode}/typing/${role}`), false).catch(console.error);
};

let typingTimeout;
text.addEventListener('input', () => {
  if (!role || !roomCode) return;
  const typingRef = ref(db, `rooms/${roomCode}/typing/${role}`);
  set(typingRef, true).catch(console.error);
  
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    set(typingRef, false).catch(console.error);
  }, 1500);
});

text.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send.onclick();
  }
});

/* SEND MEDIA */
media.onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  
  try {
    const fileRef = storageRef(storage, `rooms/${roomCode}/${Date.now()}_${f.name}`);
    await uploadBytes(fileRef, f);
    const url = await getDownloadURL(fileRef);
    
    const messagesRef = ref(db, `rooms/${roomCode}/messages`);
    await push(messagesRef, {
      type: "media",
      src: url,
      mediaType: f.type.startsWith("image") ? "image" : "video",
      sender: role,
      time: Date.now()
    });
  } catch (error) {
    console.error("Upload error:", error);
    alert("Failed to upload media");
  }
  media.value = "";
};

/* VOICE RECORD */
let recorder, chunks = [], recording = false, startTime;
mic.onclick = async () => {
  if (!recording) {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(s);
    chunks = [];
    startTime = Date.now();
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start();
    recording = true;
    mic.textContent = "🔴";
  } else {
    recorder.stop();
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: "audio/webm" });
      
      try {
        const fileRef = storageRef(storage, `rooms/${roomCode}/voice_${Date.now()}.webm`);
        await uploadBytes(fileRef, blob);
        const url = await getDownloadURL(fileRef);
        
        const messagesRef = ref(db, `rooms/${roomCode}/messages`);
        await push(messagesRef, {
          type: "voice",
          src: url,
          duration: Math.floor((Date.now() - startTime) / 1000),
          sender: role,
          time: Date.now()
        });
      } catch (error) {
        console.error("Voice upload error:", error);
        alert("Failed to upload voice message");
      }
      
      recorder.stream.getTracks().forEach(t => t.stop());
      recording = false;
      mic.textContent = "🎤";
    };
  }
};

/* CLEAR */
document.getElementById("clear").onclick = async () => {
  if (confirm("Clear chat for everyone?")) {
    const messagesRef = ref(db, `rooms/${roomCode}/messages`);
    await remove(messagesRef);
  }
};

// Initialize if already logged in
if (role && roomCode) {
  initChat();
}
</script>
